name: Update rule sets

on:
  push:
    branches: [master]
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-ruleset

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          curl -fsSL https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box_1.14.4_linux_amd64.deb -o /tmp/sing-box.deb
          sudo apt-get install -y /tmp/sing-box.deb

      - name: Convert and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git show-ref --verify --quiet refs/remotes/origin/ruleset; then
            git branch ruleset origin/ruleset
          fi
          python convert.py
          git push origin refs/heads/ruleset
